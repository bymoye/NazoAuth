# NazoAuth mTLS location preset for nginx.
#
# The public listener must be configured with ssl_verify_client and a reviewed
# ssl_client_certificate bundle. Never expose the upstream listener publicly.
location / {
    proxy_pass http://nazoauth:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;

    # Overwrite, rather than append, every client-supplied certificate field.
    proxy_set_header Client-Cert "";
    proxy_set_header Client-Cert-Chain "";
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header X-SSL-Client-Subject-DN $ssl_client_s_dn;
}
