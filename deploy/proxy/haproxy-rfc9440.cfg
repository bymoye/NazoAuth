# HAProxy 3.2 reference boundary for NazoAuth.
#
# Replace paths, names, addresses, and ports for the deployment. The
# active-client-cas.pem file is installed dynamically by the deployment owner;
# it contains public CA certificates only.

global
  log stdout format raw local0

defaults
  log global
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend nazoauth_public
  bind :443 ssl crt /run/nazoauth/server.pem ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.3 no-tls-tickets ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384 ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Host
  http-request del-header X-Forwarded-Port
  http-request del-header X-Forwarded-Proto
  http-request del-header Client-Cert
  http-request del-header Client-Cert-Chain
  http-request del-header X-SSL-Client-Verify
  http-request del-header X-SSL-Client-Cert
  http-request del-header X-SSL-Client-Subject-DN
  default_backend nazoauth

frontend nazoauth_mtls
  bind :8443 ssl crt /run/nazoauth/server.pem ca-file /run/nazoauth/active-client-cas.pem verify required no-ca-names ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.3 no-tls-tickets ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384 ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Host
  http-request del-header X-Forwarded-Port
  http-request del-header X-Forwarded-Proto
  http-request del-header Client-Cert
  http-request del-header Client-Cert-Chain
  http-request del-header X-SSL-Client-Verify
  http-request del-header X-SSL-Client-Cert
  http-request del-header X-SSL-Client-Subject-DN
  http-request set-header Client-Cert ":%[ssl_c_der,base64]:" if { ssl_c_used }
  default_backend nazoauth

backend nazoauth
  server app 127.0.0.1:8000 check
