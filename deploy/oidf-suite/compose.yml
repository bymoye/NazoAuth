name: nazoauth-oidf-suite

x-suite-build: &suite-build
  context: ${NAZOAUTH_SOURCE_DIR:?set NAZOAUTH_SOURCE_DIR to the NazoAuth checkout}
  dockerfile: deploy/oidf-suite/Containerfile
  args:
    OIDF_SUITE_UPSTREAM_REVISION: ${OIDF_SUITE_UPSTREAM_REVISION:-946451d1ce29965c9ab7aee05f5003552233160e}
    OIDF_SUITE_OVERLAY_SHA256: ${OIDF_SUITE_OVERLAY_SHA256:-111831ea9c949b36f05fafe5599afae4ffd022050659f77864b24e90e75e8704}
  additional_contexts:
    oidf_suite: ${OIDF_SUITE_SOURCE_DIR:?set OIDF_SUITE_SOURCE_DIR to the pinned suite checkout}

x-suite-environment: &suite-environment
  BASE_URL: ${OIDF_SUITE_BASE_URL:?set OIDF_SUITE_BASE_URL to the public HTTPS origin}
  BASE_MTLS_URL: ${OIDF_SUITE_BASE_URL:?set OIDF_SUITE_BASE_URL to the public HTTPS origin}
  MONGODB_HOST: mongodb
  OIDC_GOOGLE_CLIENTID: google-client
  OIDC_GOOGLE_SECRET: google-secret
  OIDC_GITLAB_CLIENTID: gitlab-client
  OIDC_GITLAB_SECRET: gitlab-secret

services:
  pki-init:
    build:
      context: ${NAZOAUTH_SOURCE_DIR:?set NAZOAUTH_SOURCE_DIR to the NazoAuth checkout}
      dockerfile: deploy/oidf-proxy/Containerfile
      target: pki-init
    environment:
      OIDF_TARGET_HOSTNAME: ${OIDF_TARGET_HOSTNAME:?set OIDF_TARGET_HOSTNAME to the target issuer hostname}
    volumes:
      - oidf_proxy_pki:/pki

  mongodb:
    image: docker.io/library/mongo:6.0.13
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: 500k
        max-file: "5"

  server:
    image: nazoauth-oidf-suite:${OIDF_SUITE_IMAGE_TAG:-946451d1}
    build: *suite-build
    restart: unless-stopped
    environment:
      <<: *suite-environment
      JAVA_EXTRA_ARGS: >-
        -Dfintechlabs.devmode=false
        -Doidc.google.iss=${OIDF_OPERATOR_ISSUER:?set OIDF_OPERATOR_ISSUER to a container-reachable HTTPS OIDC issuer}
        -Doidc.gitlab.iss=${OIDF_OPERATOR_ISSUER:?set OIDF_OPERATOR_ISSUER to a container-reachable HTTPS OIDC issuer}
        -Doidc.admin.issuer=${OIDF_OPERATOR_ISSUER:?set OIDF_OPERATOR_ISSUER to a container-reachable HTTPS OIDC issuer}
    ports:
      - "0.0.0.0:8443:8080"
    volumes:
      - oidf_proxy_pki:/oidf-proxy-pki:ro
    depends_on:
      mongodb:
        condition: service_started
      pki-init:
        condition: service_completed_successfully
    networks:
      - default
      - oidf_bridge
    logging:
      driver: json-file
      options:
        max-size: 500k
        max-file: "5"

  server-bootstrap:
    profiles: [bootstrap]
    image: nazoauth-oidf-suite:${OIDF_SUITE_IMAGE_TAG:-946451d1}
    build: *suite-build
    environment:
      <<: *suite-environment
      JAVA_EXTRA_ARGS: >-
        -Dfintechlabs.devmode=true
        -Dfintechlabs.makeDummyUserAdminInDevMode=false
        -Doidc.google.iss=${OIDF_OPERATOR_ISSUER:?set OIDF_OPERATOR_ISSUER to a container-reachable HTTPS OIDC issuer}
        -Doidc.gitlab.iss=${OIDF_OPERATOR_ISSUER:?set OIDF_OPERATOR_ISSUER to a container-reachable HTTPS OIDC issuer}
        -Doidc.admin.issuer=${OIDF_OPERATOR_ISSUER:?set OIDF_OPERATOR_ISSUER to a container-reachable HTTPS OIDC issuer}
    ports:
      - "127.0.0.1:18443:8080"
    depends_on:
      mongodb:
        condition: service_started
      pki-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 500k
        max-file: "5"

volumes:
  mongodb_data:
  oidf_proxy_pki:
    name: nazoauth-oidf-proxy-pki

networks:
  default:
  oidf_bridge:
    name: nazoauth-oidf-bridge
    ipam:
      config:
        - subnet: 172.30.250.0/24
