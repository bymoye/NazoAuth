events {}

http {
    server {
        listen 443 ssl;
        server_name 567t0yglur-443.cnb.run;

        ssl_certificate /etc/nginx/pki/server.crt;
        ssl_certificate_key /etc/nginx/pki/server.key;
        ssl_client_certificate /etc/nginx/pki/client-ca.pem;
        ssl_verify_client optional;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://nazoauth-target:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header X-SSL-Client-Subject-DN $ssl_client_s_dn;
        }
    }
}
