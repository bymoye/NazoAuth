name: nazo-oauth

services:
  secrets-init:
    image: docker.io/library/alpine:3.22
    volumes:
      - runtime_secrets:/run/nazoauth-secrets
      - ./deploy/compose/initialize-secrets.sh:/usr/local/libexec/nazoauth-initialize-secrets.sh:ro
    command: ["/bin/sh", "/usr/local/libexec/nazoauth-initialize-secrets.sh"]
    networks:
      nazo_oauth_net:

  server:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /var/lib/nazo_oauth
      DATABASE_URL_FILE: /run/nazoauth-secrets/database-url
      VALKEY_URL_FILE: /run/nazoauth-secrets/valkey-url
    volumes:
      - ${NAZOAUTH_CONFIG:-./.env.yaml.example}:/app/.env.yaml:ro
      - keys_data:/var/lib/nazo_oauth/keys
      - avatars_data:/var/lib/nazo_oauth/avatars
      - generated_secrets:/var/lib/nazo_oauth/secrets
      - bootstrap_data:/var/lib/nazo_oauth/bootstrap
      - runtime_secrets:/run/nazoauth-secrets:ro
    ports:
      - "127.0.0.1:${NAZOAUTH_PORT:-8000}:8000"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      nazo_oauth_net:
    command: ["nazoauth", "server"]

  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: oauth
      POSTGRES_USER: nazoauth
      POSTGRES_PASSWORD_FILE: /run/nazoauth-secrets/postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql
      - runtime_secrets:/run/nazoauth-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      nazo_oauth_net:

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--aclfile",
        "/run/nazoauth-secrets/valkey.acl",
        "--save",
        "60",
        "1",
        "--loglevel",
        "warning",
      ]
    volumes:
      - valkey_data:/data
      - runtime_secrets:/run/nazoauth-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "VALKEYCLI_AUTH=$$(cat /run/nazoauth-secrets/valkey-password) valkey-cli ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      nazo_oauth_net:

volumes:
  postgres_data:
  valkey_data:
  keys_data:
  avatars_data:
  bootstrap_data:
  generated_secrets:
  runtime_secrets:

networks:
  nazo_oauth_net:
    driver: bridge
