name: nazo-oauth

services:
  runtime-init:
    image: docker.io/library/alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    user: "0:0"
    volumes:
      - keys_data:/state/keys
      - avatars_data:/state/avatars
      - generated_secrets:/state/secrets
      - bootstrap_data:/state/bootstrap
      - instance_data:/state/instance
      - ui_releases:/state/ui-releases
      - operator_state:/state/operator
    command: ["sh", "-euc", "chown -R 10001:10001 /state/*; chmod 0700 /state/*"]
    networks:
      nazo_oauth_net:

  server:
    build:
      context: .
      dockerfile: Containerfile
      target: development-runtime
    restart: unless-stopped
    environment:
      DATA_DIR: /var/lib/nazo_oauth
      DATABASE_URL: "postgresql://nazoauth:${NAZOAUTH_POSTGRES_PASSWORD:?set the URL-safe PostgreSQL runtime password using only RFC 3986 unreserved characters}@postgres:5432/oauth"
      VALKEY_URL: "redis://default:${NAZOAUTH_VALKEY_PASSWORD:?set a URL-safe Valkey password using only RFC 3986 unreserved characters}@valkey:6379/0"
      VALKEY_STATE_EPOCH: ${NAZOAUTH_VALKEY_STATE_EPOCH:?set a new UUID for first deployment and every restored Valkey state boundary}
      PUBLIC_BASE_URL: ${NAZOAUTH_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      TRANSPORT_MODE: ${NAZOAUTH_TRANSPORT_MODE:-loopback-http}
      TRUSTED_PROXY_CIDRS: ${NAZOAUTH_TRUSTED_PROXY_CIDRS:-}
      MTLS_CERTIFICATE_SOURCE: ${NAZOAUTH_MTLS_CERTIFICATE_SOURCE:-}
    volumes:
      - keys_data:/var/lib/nazo_oauth/keys
      - avatars_data:/var/lib/nazo_oauth/avatars
      - generated_secrets:/var/lib/nazo_oauth/secrets
      - bootstrap_data:/var/lib/nazo_oauth/bootstrap
      - instance_data:/var/lib/nazo_oauth/instance
      - ui_releases:/var/lib/nazo_oauth/ui-releases
    ports:
      - "${NAZOAUTH_BIND_ADDRESS:-127.0.0.1}:${NAZOAUTH_PORT:-8000}:8000"
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      nazo_oauth_net:
    command: ["nazoauth", "server"]

  migrate:
    build:
      context: .
      dockerfile: Containerfile
      target: development-runtime
    environment:
      DATABASE_URL: "postgresql://nazoauth_lifecycle:${NAZOAUTH_POSTGRES_LIFECYCLE_PASSWORD:?set the URL-safe PostgreSQL lifecycle password using only RFC 3986 unreserved characters}@postgres:5432/oauth"
      NAZOAUTH_MIGRATION_RUNTIME_ROLE: nazoauth
      PUBLIC_BASE_URL: ${NAZOAUTH_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
    volumes:
      - operator_state:/var/lib/nazoauth/operator-state
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      nazo_oauth_net:
    command: ["nazoauth", "migrate"]

  postgres:
    build:
      context: .
      dockerfile: Containerfile
      target: compose-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oauth
      POSTGRES_USER: nazoauth_lifecycle
      POSTGRES_PASSWORD: "${NAZOAUTH_POSTGRES_LIFECYCLE_PASSWORD:?set the URL-safe PostgreSQL lifecycle password using only RFC 3986 unreserved characters}"
      NAZOAUTH_POSTGRES_PASSWORD: "${NAZOAUTH_POSTGRES_PASSWORD:?set the URL-safe PostgreSQL runtime password using only RFC 3986 unreserved characters}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      nazo_oauth_net:

  valkey:
    image: docker.io/valkey/valkey:8-alpine@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: "${NAZOAUTH_VALKEY_PASSWORD:?set a URL-safe Valkey password using only RFC 3986 unreserved characters}"
    command: ["sh", "-euc", 'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save 60 1 --loglevel warning']
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=$$VALKEY_PASSWORD valkey-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      nazo_oauth_net:

volumes:
  postgres_data:
  valkey_data:
  keys_data:
  avatars_data:
  bootstrap_data:
  instance_data:
  generated_secrets:
  ui_releases:
  operator_state:

networks:
  nazo_oauth_net:
    driver: bridge
