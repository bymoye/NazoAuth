[workspace]
members = [
    "crates/authorization-server-core",
    "crates/digital-credentials",
    "crates/key-management",
    "crates/openid4vci",
    "crates/openid4vp",
    "crates/openid4vc-http-actix",
    "crates/persistence-postgres",
    "crates/authorization-server",
    "crates/operator-protocol",
    "crates/http-signatures",
    "crates/http-actix",
    "crates/identity",
    "crates/runtime-capabilities",
    "crates/resource-server",
    "crates/scim-events",
    "crates/state-store-valkey",
]
default-members = ["crates/authorization-server"]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.41"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nazozero/NazoAuth"

[workspace.dependencies]
actix-cors = "0.7.1"
actix-files = "0.7.0"
actix-web = "4.14.0"
actix-tls = "3.4.0"
anyhow = "1.0.103"
aes-gcm = "0.11.0-rc.2"
arc-swap = "1.8.2"
argon2 = "0.5.3"
atomicwrites = "0.4.4"
aws-lc-rs = "1.17.1"
base64 = "0.23.1"
blake3 = "1.8.5"
chrono = "0.4.45"
der = { version = "0.8.1", features = ["derive"] }
diesel = "2.3.11"
diesel-async = "0.9.2"
diesel_migrations = "2.3.2"
ed25519-dalek = "3.0.0"
fred = "10.1.0"
flate2 = "1.1.9"
fs2 = "0.4.3"
futures-util = "0.3.32"
futures-executor = "0.3.32"
hmac = "0.13.0"
jsonwebtoken = { version = "11.0.0", default-features = false }
mdoc-rs = { version = "0.2.0", default-features = false, features = ["issue"] }
coset = "0.4.2"
ciborium = "0.2.2"
lettre = { version = "0.11.22", default-features = false }
nazo-auth = { version = "0.1.4", path = "crates/authorization-server-core" }
nazo-digital-credentials = { version = "0.1.4", path = "crates/digital-credentials" }
nazo-http-actix = { version = "0.1.4", path = "crates/http-actix" }
nazo-http-signatures = { version = "0.1.4", path = "crates/http-signatures" }
nazo-identity = { version = "0.1.4", path = "crates/identity" }
nazo-key-management = { version = "0.1.4", path = "crates/key-management" }
nazo-openid4vci = { version = "0.1.4", path = "crates/openid4vci" }
nazo-openid4vp = { version = "0.1.4", path = "crates/openid4vp" }
nazo-openid4vc-http-actix = { version = "0.1.4", path = "crates/openid4vc-http-actix" }
nazo-operator-protocol = { version = "0.1.4", path = "crates/operator-protocol" }
nazo-postgres = { version = "0.1.4", path = "crates/persistence-postgres" }
nazo-resource-server = { version = "0.1.4", path = "crates/resource-server" }
nazo-runtime-modules = { version = "0.1.4", path = "crates/runtime-capabilities" }
nazo-scim-events = { version = "0.1.4", path = "crates/scim-events" }
nazo-valkey = { version = "0.1.4", path = "crates/state-store-valkey" }
pem = "4.0.0"
pkcs8 = { version = "0.11.0", features = ["alloc"] }
p256 = "0.14.0"
passkey-auth = "0.1.3"
process-wrap = { version = "9.1.0", default-features = false, features = ["creation-flags", "job-object", "kill-on-drop", "process-group", "tokio1"] }
proptest = "1"
rand = "0.10.1"
rpassword = "7.4.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "std"] }
webpki = { package = "rustls-webpki", version = "0.103.13" }
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
semver = "1.0.27"
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.44"
thiserror = "2.0.18"
time = "0.3.47"
tokio = "1.52.3"
tokio-postgres = "0.7.15"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs", "native-certs", "webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = "1.23.5"
wait-timeout = "0.2.1"
x509-cert = "0.3.0"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Reviewed Actix h2 0.4 port, pinned to an immutable upstream fork revision.
[patch.crates-io]
actix-http = { git = "https://github.com/nazozero/actix-web", rev = "cad2a2d5fc9a994438021711460673649e27fd1d" }
# Reviewed mdoc-rs coset 0.4 port, pinned to an immutable upstream fork revision.
mdoc-rs = { git = "https://github.com/nazozero/mdoc-rs", rev = "8e3b529ae1be2d9b5c74baa1f7b7e7abcf958020" }
