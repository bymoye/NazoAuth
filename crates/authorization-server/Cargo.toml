diesel-async = { workspace = true, features = ["postgres", "deadpool"] }
der.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
hmac.workspace = true
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
