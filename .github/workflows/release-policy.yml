name: release-policy

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release-policy.yml"
      - ".github/workflows/release-security.yml"
      - "release/**"
      - "scripts/build_release_attestation.py"
      - "scripts/validate_release_oci.py"
      - "tests/unit/test_release_attestation.py"
      - "tests/unit/test_release_governance.py"
      - "tests/unit/test_release_oci.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release policy contracts
        run: >-
          python3 -m unittest
          tests.unit.test_release_attestation
          tests.unit.test_release_governance
          tests.unit.test_release_oci
