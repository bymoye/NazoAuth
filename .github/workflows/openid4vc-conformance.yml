name: openid4vc-conformance

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact deployed NazoAuth commit to test
        required: true
        type: string
      target_origin:
        description: Public HTTPS issuer origin to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openid4vc-conformance-${{ inputs.deployed_sha }}
  cancel-in-progress: false

jobs:
  official-openid4vc-matrix:
    runs-on: ubuntu-latest
    environment: oidf-conformance
    timeout-minutes: 90
    env:
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      OIDF_REF: dee9a25160e789f0f80517674693ef7989ab9fa1
      CONFORMANCE_SERVER: https://www.certification.openid.net
      TARGET_ORIGIN: ${{ inputs.target_origin }}
      TRUSTED_TARGET_ORIGIN: ${{ vars.OPENID4VC_TARGET_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify deployed revision and target are trusted
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$DEPLOYED_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_SHA" "origin/${{ github.event.repository.default_branch }}"
          git checkout --detach "$DEPLOYED_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          test -n "$TRUSTED_TARGET_ORIGIN"
          test "$TARGET_ORIGIN" = "$TRUSTED_TARGET_ORIGIN"

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Clone pinned official suite
        shell: bash
        run: |
          git init oidf-conformance-suite
          git -C oidf-conformance-suite remote add origin https://gitlab.com/openid/conformance-suite.git
          git -C oidf-conformance-suite fetch --depth 1 origin "$OIDF_REF"
          git -C oidf-conformance-suite checkout --detach FETCH_HEAD
          test "$(git -C oidf-conformance-suite rev-parse HEAD)" = "$OIDF_REF"
          diff -u requirements/oidf-conformance.in oidf-conformance-suite/scripts/requirements.txt
          test -z "$(git -C oidf-conformance-suite status --porcelain --untracked-files=no)"

      - name: Install pinned runner dependencies
        run: python -m pip install --require-hashes -r requirements/oidf-conformance.txt

      - name: Materialize OpenID4VC job secrets
        run: python scripts/materialize_github_oidf_secrets.py --openid4vc --output-dir "$RUNNER_TEMP/oidf-secrets"
        env:
          OIDF_CONFORMANCE_TOKEN: ${{ secrets.OIDF_CONFORMANCE_TOKEN }}
          OPENID4VC_OIDF_BASE_CONFIG_JSON: ${{ secrets.OPENID4VC_OIDF_BASE_CONFIG_JSON }}
          OPENID4VC_OIDF_MTLS_CONFIG_JSON: ${{ secrets.OPENID4VC_OIDF_MTLS_CONFIG_JSON }}
          OPENID4VC_OIDF_DRIVER_CONFIG_JSON: ${{ secrets.OPENID4VC_OIDF_DRIVER_CONFIG_JSON }}
          OIDF_DELIVERED_CLIENT_MATERIAL_JSON: ${{ secrets.OIDF_DELIVERED_CLIENT_MATERIAL_JSON }}
          OIDF_USER_EMAIL: ${{ secrets.OIDF_USER_EMAIL }}
          OIDF_USER_PASSWORD: ${{ secrets.OIDF_USER_PASSWORD }}
          OIDF_ADMIN_EMAIL: ${{ secrets.OIDF_ADMIN_EMAIL }}
          OIDF_ADMIN_PASSWORD: ${{ secrets.OIDF_ADMIN_PASSWORD }}

      - name: Materialize isolated OpenID4VC configurations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$TARGET_ORIGIN" || {
            echo "Supply the public production HTTPS issuer through workflow_dispatch input target_origin." >&2
            exit 1
          }
          install -d -m 700 runtime/openid4vc
          python scripts/materialize_openid4vc_oidf_config.py \
            --base-config-json-file "$RUNNER_TEMP/oidf-secrets/base.json" \
            --mtls-config-json-file "$RUNNER_TEMP/oidf-secrets/mtls.json" \
            --driver-config-json-file "$RUNNER_TEMP/oidf-secrets/driver-input.json" \
            --credential-datasets-json-file tests/contracts/openid4vc-conformance-datasets.json \
            --conformance-server "$CONFORMANCE_SERVER" \
            --target-origin "$TARGET_ORIGIN" \
            --onboarding-profile official \
            --output-dir runtime/openid4vc
          python scripts/apply_oidf_delivered_client_material.py \
            --material-json-file "$RUNNER_TEMP/oidf-secrets/delivered-client-material.json" \
            --config-json-file runtime/openid4vc/openid4vc-plan-configs.json \
            --expected-target-issuer "$TARGET_ORIGIN" \
            --expected-suite-base-url "$CONFORMANCE_SERVER"
          python scripts/apply_oidf_browser_credentials.py \
            --config-json-file runtime/openid4vc/openid4vc-plan-configs.json \
            --credentials-file "$RUNNER_TEMP/oidf-secrets/browser-credentials.json"

      - name: Run official OpenID4VC Final and HAIP alpha matrix
        shell: bash
        run: |
          python -u scripts/run_openid4vc_conformance.py \
            --driver-config-json-file runtime/openid4vc/openid4vc-driver.json \
            --operator-credentials-file "$RUNNER_TEMP/oidf-secrets/operator-credentials.json" \
            --suite-token-file "$RUNNER_TEMP/oidf-secrets/suite-token" \
            --plan-group-size 4 \
            -- \
            --suite-dir oidf-conformance-suite \
            --conformance-server "$CONFORMANCE_SERVER" \
            --target-issuer "$TARGET_ORIGIN" \
            --config-json-file runtime/openid4vc/openid4vc-plan-configs.json \
            --plan-set-json-file runtime/openid4vc/openid4vc-plan-set.json \
            --expected-failures-file runtime/openid4vc/openid4vc-expected-problems.json \
            --expected-skips-file runtime/openid4vc/openid4vc-expected-skips.json \
            --export-dir runtime/openid4vc/results \
            --timeout-seconds 4800 \
            --monitor-interval-seconds 10 \
            --token-file "$RUNNER_TEMP/oidf-secrets/suite-token"

      - name: Verify official suite remained pristine
        if: always()
        shell: bash
        run: |
          test ! -d oidf-conformance-suite/.git || {
            test "$(git -C oidf-conformance-suite rev-parse HEAD)" = "$OIDF_REF"
            test -z "$(git -C oidf-conformance-suite status --porcelain --untracked-files=no)"
          }

      - name: Remove plaintext secrets
        if: always()
        shell: bash
        run: |
          rm -f runtime/openid4vc/openid4vc-driver.json runtime/openid4vc/openid4vc-plan-configs.json
          rm -rf -- "$RUNNER_TEMP/oidf-secrets"

      - name: Upload redacted conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openid4vc-conformance-${{ inputs.deployed_sha }}
          path: runtime/openid4vc/results/evidence-manifest.json
          if-no-files-found: error
          retention-days: 30
