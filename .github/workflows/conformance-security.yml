name: conformance-security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/conformance-security.yml"
      - ".github/e2e-runner.Containerfile"
      - ".github/e2e-requirements.in"
      - ".github/e2e-requirements.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "deny.toml"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**/*.rs"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "migrations/**"
      - "scripts/**"
      - "deploy/**"
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yml"
      - ".env.yaml.example"
  pull_request:
    paths:
      - ".github/workflows/conformance-security.yml"
      - ".github/e2e-runner.Containerfile"
      - ".github/e2e-requirements.in"
      - ".github/e2e-requirements.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "deny.toml"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**/*.rs"
      - "examples/**/Cargo.toml"
      - "examples/**/Cargo.lock"
      - "migrations/**"
      - "scripts/**"
      - "deploy/**"
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yml"
      - ".env.yaml.example"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check real HTTP source policy
        run: |
          python -m py_compile scripts/full_real_request_source_policy.py scripts/full_real_request_e2e.py scripts/rfc9967_scim_set_e2e.py
          python scripts/full_real_request_e2e.py --source-policy-check
          python tests/unit/test_full_real_request_e2e_source_policy.py
          python scripts/rfc9967_scim_set_e2e.py --source-policy-check
          python tests/unit/test_rfc9967_scim_set_e2e_source_policy.py
      - name: Verify compatibility contracts
        run: python scripts/verify_static_contracts.py --check

  supply-chain-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Install pinned Rust supply-chain tools
        uses: taiki-e/install-action@v2.83.2
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-cyclonedx@0.5.9
      - name: Audit Rust advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Generate Rust SBOM
        run: |
          cargo cyclonedx --manifest-path crates/authorization-server/Cargo.toml --format json --override-filename nazo-oauth-server.cdx
          mkdir -p target
          mv crates/authorization-server/nazo-oauth-server.cdx.json target/nazo-oauth-server.cdx.json
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build service image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          tags: nazo-oauth-supply-chain:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=nazo-oauth-service
          cache-to: type=gha,mode=max,scope=nazo-oauth-service
      - name: Scan service image
        run: |
          docker save nazo-oauth-supply-chain:${{ github.sha }} -o /tmp/nazo-oauth-supply-chain.tar
          docker run --rm \
            -v /tmp/nazo-oauth-supply-chain.tar:/image.tar:ro \
            docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
              --format table \
              --exit-code 1 \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --input /image.tar
      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nazo-oauth-rust-sbom
          path: target/nazo-oauth-server.cdx.json
          if-no-files-found: error

  real-http-security-matrix:
    runs-on: ubuntu-latest
    needs:
      - source-policy-gate
      - supply-chain-gate
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build service image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          tags: nazo-oauth-e2e:latest
          load: true
          cache-from: type=gha,scope=nazo-oauth-service
          cache-to: type=gha,mode=max,scope=nazo-oauth-service
      - name: Build E2E runner image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          tags: nazo-oauth-e2e-runner:latest
          load: true
          cache-from: type=gha,scope=nazo-oauth-e2e-runner
          cache-to: type=gha,mode=max,scope=nazo-oauth-e2e-runner
          file: .github/e2e-runner.Containerfile
      - name: Prepare isolated runtime config
        run: |
          mkdir -p runtime/e2e/keys runtime/e2e/avatars runtime/e2e/secrets runtime/e2e/bootstrap
          python scripts/ensure_runtime_keyset.py --key-dir runtime/e2e/keys --active-alg RS256 --required-alg RS256 --required-alg PS256
          cat > runtime/e2e/.env.yaml <<'YAML'
          BIND: "0.0.0.0:8000"
          DATA_DIR: "/var/lib/nazo_oauth"
          DATABASE_URL: "postgresql://postgres:postgres@nazo-oauth-e2e-postgres:5432/oauth"
          VALKEY_URL: "redis://nazo-oauth-e2e-valkey:6379/0"
          VALKEY_COMMAND_TIMEOUT_MS: 1000
          ISSUER: "http://127.0.0.1:8000"
          FRONTEND_BASE_URL: "http://127.0.0.1:3000"
          CORS_ALLOWED_ORIGINS:
            - "http://127.0.0.1:3000"
          DEFAULT_AUDIENCE: "resource://default"
          SESSION_COOKIE_NAME: "nazo_oauth_session"
          CSRF_COOKIE_NAME: "nazo_oauth_csrf"
          COOKIE_SECURE: false
          SESSION_TTL_SECONDS: 28800
          AUTH_CODE_TTL_SECONDS: 60
          ACCESS_TOKEN_TTL_SECONDS: 300
          ID_TOKEN_TTL_SECONDS: 600
          REFRESH_TOKEN_TTL_SECONDS: 2592000
          AVATAR_MAX_BYTES: 2097152
          CLIENT_DELIVERY_TTL_SECONDS: 86400
          RATE_LIMIT_WINDOW_SECONDS: 60
          AUTH_RATE_LIMIT_MAX_REQUESTS: 100000
          TOKEN_RATE_LIMIT_MAX_REQUESTS: 100000
          TOKEN_MANAGEMENT_RATE_LIMIT_MAX_REQUESTS: 100000
          TRUSTED_PROXY_CIDRS: ""
          CLIENT_IP_HEADER_MODE: "none"
          SUBJECT_TYPE: "public"
          PAIRWISE_SUBJECT_SECRET: ""
          PAR_TTL_SECONDS: 90
          REQUIRE_PUSHED_AUTHORIZATION_REQUESTS: false
          ENABLE_REQUEST_OBJECT: true
          ENABLE_PAR_REQUEST_OBJECT: true
          ENABLE_AUTHORIZATION_DETAILS: true
          ENABLE_FAPI_HTTP_SIGNATURES: false
          FAPI_HTTP_SIGNATURE_MAX_AGE_SECONDS: 60
          ENABLE_SCIM_SECURITY_EVENTS: true
          FEDERATION_PROVIDER_CONFIGS: >-
            [{"provider_id":"codecov-oidc","enabled":true,"display_name":"Codecov OIDC","adapter_type":"oidc","issuer":"https://issuer.example","authorization_endpoint":"https://issuer.example/authorize","token_endpoint":"https://issuer.example/token","jwks_url":"https://issuer.example/jwks","client_id":"codecov-oidc-client","client_secret":"codecov-oidc-secret","redirect_uri":"http://127.0.0.1:8000/auth/federation/codecov-oidc/callback","scopes":"openid email profile"}]
          FEDERATION_SAML_GATEWAY_ENABLED: true
          FEDERATION_SAML_GATEWAY_ISSUER: "codecov-saml-gateway"
          FEDERATION_SAML_GATEWAY_AUDIENCE: "nazo-oauth-codecov"
          FEDERATION_SAML_GATEWAY_SECRET: "codecov-saml-gateway-secret-000000"
          EMAIL_DELIVERY: "smtp"
          EMAIL_CODE_TTL_SECONDS: 900
          EMAIL_CODE_SEND_COOLDOWN_SECONDS: 1
          EMAIL_CODE_PEER_COOLDOWN_SECONDS: 1
          EMAIL_SMTP_HOST: "nazo-oauth-e2e-runner"
          EMAIL_SMTP_PORT: 1025
          EMAIL_SMTP_TLS: "none"
          EMAIL_SMTP_USERNAME: ""
          EMAIL_SMTP_PASSWORD: ""
          EMAIL_FROM: "Nazo OAuth <no-reply@example.com>"
          EMAIL_CODE_DEV_RESPONSE_ENABLED: false
          AVATAR_STORAGE_DIR: "/var/lib/nazo_oauth/avatars"
          JWK_KEYS_DIR: "/var/lib/nazo_oauth/keys"
          RUST_LOG: "info"
          YAML
          cp runtime/e2e/.env.yaml runtime/e2e/.env-signed.yaml
          sed -i 's/ENABLE_FAPI_HTTP_SIGNATURES: false/ENABLE_FAPI_HTTP_SIGNATURES: true/' runtime/e2e/.env-signed.yaml
      - name: Start PostgreSQL and Valkey
        run: |
          docker network create nazo-oauth-e2e-net
          docker run -d --name nazo-oauth-e2e-postgres --network nazo-oauth-e2e-net -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=oauth postgres:18-alpine
          docker run -d --name nazo-oauth-e2e-valkey --network nazo-oauth-e2e-net valkey/valkey:8-alpine
          ready=false
          for _ in $(seq 1 60); do
            if docker run --rm --network nazo-oauth-e2e-net -e PGPASSWORD=postgres postgres:18-alpine \
              sh -lc 'pg_isready -h nazo-oauth-e2e-postgres -U postgres -d oauth && psql -h nazo-oauth-e2e-postgres -U postgres -d oauth -c "select 1" >/dev/null'
            then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = "true" ]
      - name: Migrate and start server
        run: |
          image_digest="$(docker image inspect nazo-oauth-e2e:latest --format '{{.Id}}')"
          cargo run --locked --quiet -p nazo-operator-protocol --example ci_operator_task -- prepare \
            --config runtime/e2e/.env.yaml \
            --image-ref nazo-oauth-e2e:latest \
            --image-digest "$image_digest" \
            --output runtime/e2e/operator
          docker run --rm -i --name nazo-oauth-e2e-migrate --network nazo-oauth-e2e-net \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            -v "$PWD/runtime/e2e/.env.yaml:/app/.env.yaml:ro" \
            -v "$PWD/runtime/e2e/operator/controller.pub:/run/nazoauth-operator/controller.pub:ro" \
            -v "$PWD/runtime/e2e/operator/receipt.key:/run/nazoauth-operator/receipt.key:ro" \
            -v "$PWD/runtime/e2e/operator/context.json:/run/nazoauth-operator/context.json:ro" \
            -v "$PWD/runtime/e2e/operator/config-manifest.json:/run/nazoauth-operator/config-manifest.json:ro" \
            -v "$PWD/runtime/e2e/operator/state:/var/lib/nazoauth/operator-state" \
            nazo-oauth-e2e:latest nazoauth operator-task \
            <runtime/e2e/operator/envelope.jws >runtime/e2e/operator/receipt.jws
          cargo run --locked --quiet -p nazo-operator-protocol --example ci_operator_task -- verify \
            --receipt runtime/e2e/operator/receipt.jws \
            --public-key runtime/e2e/operator/receipt.pub \
            --request-sha256 runtime/e2e/operator/request.sha256
          docker run -d --name nazo-oauth-e2e-server --network nazo-oauth-e2e-net \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -e NAZO_RUNTIME_INSTANCE_ID=e2e-primary \
            -v "$PWD/runtime/e2e/.env.yaml:/app/.env.yaml:ro" \
            -v "$PWD/runtime/e2e/secrets:/var/lib/nazo_oauth/secrets" \
            -v "$PWD/runtime/e2e/bootstrap:/var/lib/nazo_oauth/bootstrap" \
            -v "$PWD/runtime/e2e/keys:/var/lib/nazo_oauth/keys" \
            -v "$PWD/runtime/e2e/avatars:/var/lib/nazo_oauth/avatars" \
            nazo-oauth-e2e:latest nazoauth server
          docker run -d --name nazo-oauth-e2e-server-signed --network nazo-oauth-e2e-net \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -e NAZO_RUNTIME_INSTANCE_ID=e2e-signed \
            -v "$PWD/runtime/e2e/.env-signed.yaml:/app/.env.yaml:ro" \
            -v "$PWD/runtime/e2e/secrets:/var/lib/nazo_oauth/secrets" \
            -v "$PWD/runtime/e2e/bootstrap:/var/lib/nazo_oauth/bootstrap" \
            -v "$PWD/runtime/e2e/keys:/var/lib/nazo_oauth/keys" \
            -v "$PWD/runtime/e2e/avatars:/var/lib/nazo_oauth/avatars" \
            nazo-oauth-e2e:latest nazoauth server
      - name: Require both non-root servers to become ready
        run: |
          ready=false
          for _ in $(seq 1 60); do
            if docker run --rm --network nazo-oauth-e2e-net \
              nazo-oauth-e2e-runner:latest python -c \
              'import urllib.request; urllib.request.urlopen("http://nazo-oauth-e2e-server:8000/health", timeout=2).read(); urllib.request.urlopen("http://nazo-oauth-e2e-server-signed:8000/health", timeout=2).read()'
            then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker inspect nazo-oauth-e2e-server nazo-oauth-e2e-server-signed
            docker logs nazo-oauth-e2e-server || true
            docker logs nazo-oauth-e2e-server-signed || true
            exit 1
          fi
      - name: Run RFC 9967 SCIM SET black-box matrix
        run: |
          docker run --rm --name nazo-oauth-rfc9967-runner --network nazo-oauth-e2e-net \
            -v "$PWD:/app" -w /app \
            -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000 \
            -e E2E_ISSUER_URL=http://127.0.0.1:8000 \
            -e E2E_DATABASE_URL=postgresql://postgres:postgres@nazo-oauth-e2e-postgres:5432/oauth \
            nazo-oauth-e2e-runner:latest python scripts/rfc9967_scim_set_e2e.py
      - name: Run full real HTTP E2E
        run: |
          docker run --rm --name nazo-oauth-e2e-runner --network nazo-oauth-e2e-net \
            -v "$PWD:/app" -w /app \
            -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000 \
            -e E2E_SIGNED_BASE_URL=http://nazo-oauth-e2e-server-signed:8000 \
            -e E2E_ISSUER_URL=http://127.0.0.1:8000 \
            nazo-oauth-e2e-runner:latest python scripts/full_real_request_e2e.py
      - name: Run load and race gate
        run: |
          docker run --rm --name nazo-oauth-e2e-runner --network nazo-oauth-e2e-net \
            -v "$PWD:/app" -w /app \
            -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000 \
            -e LOAD_REQUESTS=400 \
            -e LOAD_CONCURRENCY=32 \
            nazo-oauth-e2e-runner:latest python scripts/full_real_request_load.py
      - name: Run Valkey outage injection
        run: |
          docker stop nazo-oauth-e2e-valkey
          docker run --rm --name nazo-oauth-e2e-runner --network nazo-oauth-e2e-net \
            -v "$PWD:/app" -w /app \
            -e E2E_BASE_URL=http://nazo-oauth-e2e-server:8000 \
            nazo-oauth-e2e-runner:latest python scripts/valkey_failure_injection.py
      - name: Cleanup
        if: always()
        run: |
          docker rm -f nazo-oauth-rfc9967-runner nazo-oauth-e2e-runner nazo-oauth-e2e-server nazo-oauth-e2e-server-signed nazo-oauth-e2e-postgres nazo-oauth-e2e-valkey 2>/dev/null || true
          docker network rm nazo-oauth-e2e-net 2>/dev/null || true
