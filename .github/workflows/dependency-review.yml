name: dependency-review

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-review.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - "Containerfile"
      - ".github/e2e-runner.Containerfile"
      - ".github/e2e-requirements.in"
      - ".github/e2e-requirements.txt"
      - ".github/workflows/*.yml"
      - ".github/dependabot.yml"
      - "renovate.json"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false

  rust-advisory-audit:
    name: Rust advisory audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust advisories
        run: cargo audit
