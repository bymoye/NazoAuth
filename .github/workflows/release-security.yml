name: release-security

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  NAZOAUTH_RELEASE_BRANCH: agent/extract-nazoauthctl
  NAZOAUTH_BUILD_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
  NAZOAUTH_BUILD_REVISION: ${{ github.sha }}
  NAZOAUTH_BUILD_ID: github:${{ github.run_id }}:${{ github.run_attempt }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful governed CI for exact tag commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_ref="refs/remotes/origin/$NAZOAUTH_RELEASE_BRANCH"
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" fetch \
            --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/heads/$NAZOAUTH_RELEASE_BRANCH:$release_ref"
          if git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            gate_event=push
            gate_branch=main
          elif [[ "$(git rev-parse "$release_ref")" = "$RELEASE_SHA" ]]; then
            gate_event=workflow_dispatch
            gate_branch=$NAZOAUTH_RELEASE_BRANCH
          else
            echo "release tag commit $RELEASE_SHA is neither reachable from main nor the exact release branch head" >&2
            exit 1
          fi
          for workflow in code-quality.yml release-policy.yml; do
            runs="$(gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f event="$gate_event" \
              -f branch="$gate_branch" \
              -f head_sha="$RELEASE_SHA" \
              -F per_page=100)"
            if ! jq -e \
              --arg sha "$RELEASE_SHA" \
              --arg event "$gate_event" \
              --arg branch "$gate_branch" '
              any(.workflow_runs[]?;
                .head_sha == $sha and
                .head_branch == $branch and
                .event == $event and
                .status == "completed" and
                .conclusion == "success")
            ' <<<"$runs" >/dev/null; then
              echo "required workflow $workflow has no successful $gate_event run on $gate_branch for $RELEASE_SHA" >&2
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Validate immutable release input
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            release_version="${GITHUB_REF_NAME#v}"
            workspace_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          print(manifest["workspace"]["package"]["version"])
          PY
            )"
            if [[ "$workspace_version" != "$release_version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
              exit 1
            fi
            metadata="$(cargo metadata --locked --no-deps --format-version 1)"
            mismatches="$(jq -r --arg version "$release_version" '
              [.workspace_members[] as $member
                | .packages[]
                | select(.id == $member and .version != $version)
                | "\(.name)=\(.version)"]
              | join(", ")
            ' <<<"$metadata")"
            if [[ -n "$mismatches" ]]; then
              echo "tag $GITHUB_REF_NAME does not match workspace package versions: $mismatches" >&2
              exit 1
            fi
          fi
          test -f release/frontend.json
          test ! -L release/frontend.json
      - name: Verify the independently released frontend subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -r '.schema' release/frontend.json)" = 1
          repository="$(jq -er '.repository' release/frontend.json)"
          version="$(jq -er '.version' release/frontend.json)"
          commit="$(jq -er '.commit' release/frontend.json)"
          identity="$(jq -er '.release_identity' release/frontend.json)"
          artifact="$(jq -er '.artifact.name' release/frontend.json)"
          expected_sha256="$(jq -er '.artifact.sha256' release/frontend.json)"
          expected_size="$(jq -er '.artifact.size' release/frontend.json)"
          test "$repository" = "nazozero/NazoAuthWeb"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$artifact" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_size" =~ ^[1-9][0-9]*$ ]]
          test "$identity" = "https://github.com/$repository/.github/workflows/release.yml@refs/tags/$version"
          test "$(jq -r '.artifact.repository' release/frontend.json)" = "$repository"
          mkdir -p target/frontend-verify target/release-evidence/frontend
          gh release download "$version" --repo "$repository" --pattern "$artifact" --dir target/frontend-verify
          subject="target/frontend-verify/$artifact"
          test "$(stat -c %s "$subject")" = "$expected_size"
          test "$(sha256sum "$subject" | cut -d ' ' -f 1)" = "$expected_sha256"
          gh attestation verify "$subject" \
            --repo "$repository" \
            --signer-workflow "$repository/.github/workflows/release.yml" \
            --source-ref "refs/tags/$version" \
            --source-digest "$commit" \
            --deny-self-hosted-runners \
            --format json > target/release-evidence/frontend/verification.json
      - name: Validate Release workflow and predicate contracts
        run: python3 -m unittest tests.unit.test_release_attestation tests.unit.test_release_governance tests.unit.test_release_oci
      - name: Install pinned Rust supply-chain tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-cyclonedx@0.5.9
      - name: Audit Rust advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Generate internal Rust SBOM evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path crates/authorization-server/Cargo.toml --format json --override-filename nazoauth.cdx
          mkdir -p target/release-evidence/sbom
          mv crates/authorization-server/nazoauth.cdx.json target/release-evidence/sbom/nazoauth.cdx.json
      - name: Upload internal supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain-evidence
          path: |
            target/release-evidence/sbom
            target/release-evidence/frontend
          if-no-files-found: error
          retention-days: 30

  operator-protocol-package:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - name: Package the unique operator protocol source
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --package nazo-operator-protocol
          mkdir -p target/release-protocol
          mapfile -t packages < <(find target/package -maxdepth 1 -type f \
            -name 'nazo-operator-protocol-*.crate' -print)
          test "${#packages[@]}" -eq 1
          cp -- "${packages[0]}" target/release-protocol/
          (cd target/release-protocol && \
            sha256sum "$(basename "${packages[0]}")" > SHA256SUMS)
      - name: Upload immutable operator protocol package input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-operator-protocol-package
          path: target/release-protocol
          if-no-files-found: error
          retention-days: 30

  platform-binaries:
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            libc: gnu
          - runner: ubuntu-24.04-arm
            os: linux
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
            libc: gnu
          - runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-musl
            executable_suffix: ""
            libc: musl
          - runner: ubuntu-24.04-arm
            os: linux
            target: aarch64-unknown-linux-musl
            executable_suffix: ""
            libc: musl
          - runner: windows-2025
            os: windows
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
            libc: msvc
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - runner: windows-11-arm
            os: windows
            target: aarch64-pc-windows-msvc
            executable_suffix: .exe
            libc: msvc
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
          - runner: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
            executable_suffix: ""
            libc: darwin
          - runner: macos-15
            os: macos
            target: aarch64-apple-darwin
            executable_suffix: ""
            libc: darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install Linux native build prerequisites
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make musl-tools perl
      - name: Bind musl builds to the native musl compiler
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          cc_variable="CC_${target//-/_}"
          linker_variable="CARGO_TARGET_${target^^}_LINKER"
          linker_variable="${linker_variable//-/_}"
          {
            echo "$cc_variable=musl-gcc"
            echo "$linker_variable=musl-gcc"
          } >> "$GITHUB_ENV"
      - name: Verify macOS native build prerequisites
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          make --version
          perl -v >/dev/null
      - name: Verify Windows native build prerequisites
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --version
          perl -v | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere is unavailable" }
          $component = "${{ matrix.msvc_component }}"
          $installation = & $vswhere -latest -products * -requires $component -property installationPath
          if (-not $installation) { throw "MSVC build tools are unavailable" }
          $nmake = Get-ChildItem -LiteralPath "$installation\VC\Tools\MSVC" -Recurse -Filter nmake.exe | Select-Object -First 1
          if (-not $nmake) { throw "nmake is unavailable" }
          "MSVC_INSTALLATION=$installation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build the server binary once for this platform
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --package nazo-oauth-server --bin nazoauth
      - name: Smoke the server binary and verify embedded build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $server = Resolve-Path "target/${{ matrix.target }}/release/nazoauth${{ matrix.executable_suffix }}"
          & $server --help
          if ($LASTEXITCODE -ne 0) { throw "nazoauth help smoke failed" }
          $identity = (& $server build-identity | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "nazoauth build identity smoke failed" }
          if ($identity.release -ne $env:NAZOAUTH_BUILD_RELEASE) { throw "embedded release mismatch" }
          if ($identity.revision -ne $env:NAZOAUTH_BUILD_REVISION) { throw "embedded revision mismatch" }
          if ($identity.build_id -ne $env:NAZOAUTH_BUILD_ID) { throw "embedded build id mismatch" }
          if ($identity.protocol -ne 1) { throw "embedded protocol mismatch" }
      - name: Verify Linux single-file native dependency boundary
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          for binary in "target/${{ matrix.target }}/release/nazoauth"; do
            dynamic="$(readelf -d "$binary")"
            if grep -Eiq 'NEEDED.*(libpq|libssl|libcrypto)' <<<"$dynamic"; then
              echo "$binary depends on a non-system database or TLS library" >&2
              exit 1
            fi
            if [[ "${{ matrix.libc }}" = musl ]]; then
              if grep -q '(NEEDED)' <<<"$dynamic"; then
                echo "$binary is not fully static" >&2
                exit 1
              fi
            fi
          done
      - name: Verify macOS single-file native dependency boundary
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for binary in "target/${{ matrix.target }}/release/nazoauth"; do
            if otool -L "$binary" | grep -Eiq '(libpq|libssl|libcrypto)'; then
              echo "$binary depends on a non-system database or TLS library" >&2
              exit 1
            fi
          done
      - name: Verify Windows single-file native dependency boundary
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:MSVC_INSTALLATION) { throw "verified MSVC installation is unavailable" }
          $dumpbin = Get-ChildItem -LiteralPath "$env:MSVC_INSTALLATION\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin is unavailable" }
          foreach ($binary in @("target/${{ matrix.target }}/release/nazoauth.exe")) {
            $dependencies = & $dumpbin.FullName /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $binary" }
            if ($dependencies -match "(?i)(libpq|libssl|libcrypto|ssleay|libeay).*\.dll") {
              throw "$binary depends on a non-system database or TLS DLL"
            }
          }
      - name: Stage platform-suffixed binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "target/release-binaries" | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/nazoauth${{ matrix.executable_suffix }}" -Destination "target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}"
      - name: Upload platform binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries-${{ matrix.target }}
          path: target/release-binaries
          if-no-files-found: error
          retention-days: 7

  container-image:
    needs: platform-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      index_digest: ${{ steps.descriptor.outputs.index_digest }}
      amd64_digest: ${{ steps.descriptor.outputs.amd64_digest }}
      arm64_digest: ${{ steps.descriptor.outputs.arm64_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native amd64 Release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries-x86_64-unknown-linux-gnu
          path: target/release-container/source-amd64
      - name: Download native arm64 Release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries-aarch64-unknown-linux-gnu
          path: target/release-container/source-arm64
      - name: Stage the exact native application binaries for OCI assembly
        shell: bash
        run: |
          set -euo pipefail
          install -Dm755 \
            target/release-container/source-amd64/nazoauth-x86_64-unknown-linux-gnu \
            target/release-container/amd64/nazoauth
          install -Dm755 \
            target/release-container/source-arm64/nazoauth-aarch64-unknown-linux-gnu \
            target/release-container/arm64/nazoauth
          test "$(find target/release-container/amd64 target/release-container/arm64 -type f -name nazoauth | wc -l)" -eq 2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install OCI inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq skopeo
      - name: Build exact multi-platform OCI archive
        id: oci
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile.release
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/nazoauth-image.oci.tar,name=ghcr.io/nazozero/nazoauth:${{ env.NAZOAUTH_BUILD_RELEASE }},oci-artifact=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=nazoauth-release-oci
          cache-to: type=gha,mode=max,scope=nazoauth-release-oci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.NAZOAUTH_BUILD_RELEASE }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Scan the exact OCI archive before publication
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ runner.temp }}/nazoauth-image.oci.tar"
          layout="$(mktemp -d "${RUNNER_TEMP}/nazoauth-image.oci.XXXXXX")"
          mkdir -p target/release-evidence/oci
          python3 scripts/validate_release_oci.py \
            --archive "$archive" \
            --layout "$layout" \
            --expected-index-digest "${{ steps.oci.outputs.digest }}" \
            --repository "ghcr.io/nazozero/nazoauth" \
            --output target/release-evidence/oci/descriptor.json
          chmod -R go+rX "$layout"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -v "$layout:/image:ro" \
              docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
                --format table \
                --exit-code 1 \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --platform "$platform" \
                --input /image
          done
      - name: Record the closed OCI descriptor
        id: descriptor
        shell: bash
        run: |
          set -euo pipefail
          descriptor="target/release-evidence/oci/descriptor.json"
          index_digest="$(jq -er .index_digest "$descriptor")"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$index_digest" = "${{ steps.oci.outputs.digest }}"
          amd64_digest="$(jq -er '.platform_manifests["linux/amd64"]' "$descriptor")"
          arm64_digest="$(jq -er '.platform_manifests["linux/arm64"]' "$descriptor")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "index_digest=$index_digest"
            echo "amd64_digest=$amd64_digest"
            echo "arm64_digest=$arm64_digest"
          } >> "$GITHUB_OUTPUT"
      - name: Upload OCI descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-oci-descriptor
          path: target/release-evidence/oci/descriptor.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload exact scanned OCI archive as internal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-oci-evidence
          path: ${{ runner.temp }}/nazoauth-image.oci.tar
          if-no-files-found: error
          retention-days: 7

  attest-platform-binaries:
    if: github.ref_type == 'tag'
    needs: [platform-binaries, container-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - target: aarch64-unknown-linux-gnu
            executable_suffix: ""
          - target: x86_64-unknown-linux-musl
            executable_suffix: ""
          - target: aarch64-unknown-linux-musl
            executable_suffix: ""
          - target: x86_64-pc-windows-msvc
            executable_suffix: .exe
          - target: aarch64-pc-windows-msvc
            executable_suffix: .exe
          - target: x86_64-apple-darwin
            executable_suffix: ""
          - target: aarch64-apple-darwin
            executable_suffix: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries-${{ matrix.target }}
          path: target/release-binaries
      - name: Download OCI descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-oci-descriptor
          path: target/release-evidence/oci
      - name: Build the closed ReleaseManifest predicate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release_attestation.py \
            --version "$GITHUB_REF_NAME" \
            --target "${{ matrix.target }}" \
            --backend-commit "$GITHUB_SHA" \
            --build-id "$NAZOAUTH_BUILD_ID" \
            --binary "target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}" \
            --operator-compatibility release/operator-compatibility.json \
            --frontend release/frontend.json \
            --oci target/release-evidence/oci/descriptor.json \
            --policy release/update-policy.json \
            --output "target/release-evidence/release-manifest-${{ matrix.target }}.json"
      - name: Attest nazoauth ReleaseManifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}
          predicate-type: https://nazo.run/attestations/release-manifest/v1
          predicate-path: target/release-evidence/release-manifest-${{ matrix.target }}.json
      - name: Attest standard binary build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release-binaries/nazoauth-${{ matrix.target }}${{ matrix.executable_suffix }}
      - name: Upload platform attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ matrix.target }}
          path: target/release-evidence
          if-no-files-found: error
          retention-days: 30

  attest-operator-protocol:
    if: github.ref_type == 'tag'
    needs: operator-protocol-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the exact packaged protocol crate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-operator-protocol-package
          path: target/release-protocol
      - name: Verify the protocol package name and digest record
        id: protocol_package
        shell: bash
        run: |
          set -euo pipefail
          package="target/release-protocol/nazo-operator-protocol-${GITHUB_REF_NAME#v}.crate"
          test -f "$package"
          (cd target/release-protocol && sha256sum --check SHA256SUMS)
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Attest operator protocol package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.protocol_package.outputs.path }}

  publish-container:
    if: github.ref_type == 'tag'
    needs: [attest-platform-binaries, container-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the exact scanned OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-oci-evidence
          path: target/release-evidence/oci
      - name: Download the closed OCI descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-oci-descriptor
          path: target/release-evidence/oci
      - name: Install OCI publication tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq skopeo
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the exact scanned OCI index without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          archive="target/release-evidence/oci/nazoauth-image.oci.tar"
          descriptor="target/release-evidence/oci/descriptor.json"
          test -f "$archive"
          test "$(jq -r .index_digest "$descriptor")" = "${{ needs.container-image.outputs.index_digest }}"
          destination="docker://ghcr.io/nazozero/nazoauth:${GITHUB_REF_NAME}"
          if existing="$(skopeo inspect "$destination" 2>/dev/null | jq -er .Digest)"; then
            if [[ "$existing" != "${{ needs.container-image.outputs.index_digest }}" ]]; then
              echo "existing OCI tag has a different digest: $existing" >&2
              exit 1
            fi
            echo "OCI tag already names the exact scanned index; resuming publication"
          else
            skopeo copy --all "oci-archive:$archive" "$destination"
          fi
          published="$(skopeo inspect "$destination" | jq -r .Digest)"
          test "$published" = "${{ needs.container-image.outputs.index_digest }}"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign the published OCI index by digest
        shell: bash
        run: cosign sign --yes ghcr.io/nazozero/nazoauth@${{ needs.container-image.outputs.index_digest }}
      - name: Attest published OCI provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nazozero/nazoauth
          subject-digest: ${{ needs.container-image.outputs.index_digest }}
          push-to-registry: true

  publish-release:
    if: github.ref_type == 'tag'
    needs: [attest-platform-binaries, attest-operator-protocol, publish-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download every attested platform binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binaries-*
          path: target/release-binaries
          merge-multiple: true
      - name: Download the attested operator protocol package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-operator-protocol-package
          path: target/release-protocol
      - name: Publish immutable server and protocol GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find target/release-binaries -maxdepth 1 -type f | wc -l)" -eq 8
          for target in \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
            x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "target/release-binaries/nazoauth-$target"
          done
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            test -f "target/release-binaries/nazoauth-$target.exe"
          done
          protocol_asset="nazo-operator-protocol-${GITHUB_REF_NAME#v}.crate"
          test -f "target/release-protocol/$protocol_asset"
          (cd target/release-protocol && sha256sum --check SHA256SUMS)
          allowed_names="$(mktemp)"
          find target/release-binaries -maxdepth 1 -type f -printf '%f\n' \
            | sort > "$allowed_names"
          printf '%s\n' "$protocol_asset" >> "$allowed_names"
          sort -u -o "$allowed_names" "$allowed_names"
          test "$(wc -l < "$allowed_names")" -eq 9
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          remote_names="$(mktemp)"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$remote_names"
          while IFS= read -r name; do
            test -z "$name" || grep -Fxq "$name" "$allowed_names" || {
              echo "GitHub Release contains an unexpected asset: $name" >&2
              exit 1
            }
          done < "$remote_names"
          existing="$(mktemp -d)"
          for asset in target/release-binaries/* "target/release-protocol/$protocol_asset"; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" "$remote_names"; then
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$existing"
              cmp --silent "$asset" "$existing/$name" || {
                echo "existing GitHub Release asset differs: $name" >&2
                exit 1
              }
              echo "GitHub Release already has the exact asset: $name"
            else
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$asset"
            fi
          done
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$remote_names"
          test "$(wc -l < "$remote_names")" -eq 9
          diff -u "$allowed_names" <(sort "$remote_names")
