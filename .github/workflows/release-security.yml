name: release-security

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag and frontend lock
        id: release
        shell: bash
        run: |
          frontend_commit="$(tr -d '\r\n' < release/frontend.lock)"
          [[ "$frontend_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "frontend_commit=$frontend_commit" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "tag_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag_release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nazozero/NazoAuthWeb
          ref: ${{ steps.release.outputs.frontend_commit }}
          path: NazoAuthWeb
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: NazoAuthWeb/package-lock.json
      - name: Build and verify pinned frontend
        working-directory: NazoAuthWeb
        run: |
          npm ci
          npm test
          mkdir -p ../target
          tar -C dist -czf ../target/nazoauth-ui.tar.gz .
      - uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libpq-dev
      - name: Install pinned Rust supply-chain tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-cyclonedx@0.5.9
      - name: Audit Rust advisories
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check advisories bans licenses sources
      - name: Generate Rust SBOM
        run: |
          cargo cyclonedx --manifest-path crates/authorization-server/Cargo.toml --format json --override-filename nazoauth.cdx
          cargo cyclonedx --manifest-path crates/nazoauthctl/Cargo.toml --format json --override-filename nazoauthctl.cdx
          mkdir -p target
          mv crates/authorization-server/nazoauth.cdx.json target/nazoauth.cdx.json
          mv crates/nazoauthctl/nazoauthctl.cdx.json target/nazoauthctl.cdx.json
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build signed-binary export image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: release-export
          tags: localhost/nazoauth-release-export:${{ steps.release.outputs.version }}
          load: true
          cache-from: type=gha,scope=nazo-oauth-service
          cache-to: type=gha,mode=max,scope=nazo-oauth-service
          build-args: |
            NAZOAUTH_BUILD_RELEASE=${{ steps.release.outputs.version }}
            NAZOAUTH_BUILD_REVISION=${{ github.sha }}
            NAZOAUTH_BUILD_ID=github:${{ github.run_id }}:${{ github.run_attempt }}
      - name: Build release image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Containerfile
          target: runtime
          tags: localhost/nazo-oauth-server:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=nazo-oauth-service
          cache-to: type=gha,mode=max,scope=nazo-oauth-service
          build-args: |
            NAZOAUTH_BUILD_RELEASE=${{ steps.release.outputs.version }}
            NAZOAUTH_BUILD_REVISION=${{ github.sha }}
            NAZOAUTH_BUILD_ID=github:${{ github.run_id }}:${{ github.run_attempt }}
      - name: Export release binary and image
        run: |
          mkdir -p target/release
          container_id="$(docker create localhost/nazoauth-release-export:${{ steps.release.outputs.version }})"
          docker cp "$container_id:/usr/local/bin/nazoauth" target/release/nazoauth
          docker cp "$container_id:/usr/local/bin/nazoauthctl" target/nazoauthctl
          docker rm "$container_id"
          cp scripts/install_nazoauthctl.sh target/install_nazoauthctl.sh
          docker save localhost/nazo-oauth-server:${{ steps.release.outputs.version }} \
            -o target/nazo-oauth-server-image.tar
      - name: Scan release images
        run: |
          for archive in target/nazo-oauth-server-image.tar; do
            docker run --rm \
              -v "$PWD/$archive:/image.tar:ro" \
              docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f image \
                --format table \
                --exit-code 1 \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --input /image.tar
          done
      - name: Build immutable update manifest
        if: steps.release.outputs.tag_release == 'true'
        run: |
          image_digest="$(docker image inspect \
            localhost/nazo-oauth-server:${{ steps.release.outputs.version }} \
            --format '{{.Id}}')"
          python3 scripts/build_release_manifest.py \
            --version "${{ steps.release.outputs.version }}" \
            --backend-commit "$GITHUB_SHA" \
            --build-id "github:${{ github.run_id }}:${{ github.run_attempt }}" \
            --image-digest "$image_digest" \
            --frontend-commit "${{ steps.release.outputs.frontend_commit }}" \
            --image target/nazo-oauth-server-image.tar \
            --ui target/nazoauth-ui.tar.gz \
            --binary target/release/nazoauth \
            --bootstrap target/install_nazoauthctl.sh \
            --updater target/nazoauthctl \
            --updater-sbom target/nazoauthctl.cdx.json \
            --sbom target/nazoauth.cdx.json \
            --policy release/update-policy.json \
            --output target/release-manifest.json
      - name: Transfer unsigned release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nazo-oauth-release-unsigned
          path: |
            target/release/nazoauth
            target/nazoauth.cdx.json
            target/nazoauthctl.cdx.json
            target/nazo-oauth-server-image.tar
            target/nazoauth-ui.tar.gz
            target/nazoauthctl
            target/install_nazoauthctl.sh
            target/release-manifest.json
          if-no-files-found: error
          retention-days: 1

  sign-and-attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download unsigned release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nazo-oauth-release-unsigned
          path: target
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign release artifacts
        run: |
          cosign sign-blob --yes --bundle target/release/nazoauth.bundle target/release/nazoauth
          cosign sign-blob --yes --bundle target/nazoauth.cdx.json.bundle target/nazoauth.cdx.json
          cosign sign-blob --yes --bundle target/nazoauthctl.cdx.json.bundle target/nazoauthctl.cdx.json
          cosign sign-blob --yes --bundle target/nazo-oauth-server-image.tar.bundle target/nazo-oauth-server-image.tar
          cosign sign-blob --yes --bundle target/nazoauth-ui.tar.gz.bundle target/nazoauth-ui.tar.gz
          cosign sign-blob --yes --bundle target/nazoauthctl.bundle target/nazoauthctl
          cosign sign-blob --yes --bundle target/install_nazoauthctl.sh.bundle target/install_nazoauthctl.sh
          if [[ -f target/release-manifest.json ]]; then
            cosign sign-blob --yes \
              --bundle target/release-manifest.json.bundle \
              target/release-manifest.json
          fi
      - name: Attest release binaries and SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            target/release/nazoauth
            target/nazoauth.cdx.json
            target/nazoauthctl.cdx.json
            target/nazoauth-ui.tar.gz
            target/nazoauthctl
            target/install_nazoauthctl.sh
      - name: Attest release image archive
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            target/nazo-oauth-server-image.tar
      - name: Attest tagged update manifest
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: target/release-manifest.json
      - name: Publish immutable tagged release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            target/release/nazoauth \
            target/release/nazoauth.bundle \
            target/nazoauth.cdx.json \
            target/nazoauth.cdx.json.bundle \
            target/nazoauthctl.cdx.json \
            target/nazoauthctl.cdx.json.bundle \
            target/nazo-oauth-server-image.tar \
            target/nazo-oauth-server-image.tar.bundle \
            target/nazoauth-ui.tar.gz \
            target/nazoauth-ui.tar.gz.bundle \
            target/nazoauthctl \
            target/nazoauthctl.bundle \
            target/install_nazoauthctl.sh \
            target/install_nazoauthctl.sh.bundle \
            target/release-manifest.json \
            target/release-manifest.json.bundle
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nazo-oauth-release-artifacts
          path: |
            target/release/nazoauth
            target/nazoauth.cdx.json
            target/nazoauthctl.cdx.json
            target/nazo-oauth-server-image.tar
            target/nazoauth-ui.tar.gz
            target/nazoauthctl
            target/install_nazoauthctl.sh
            target/release-manifest.json
            target/release/*.bundle
            target/*.bundle
          if-no-files-found: error
