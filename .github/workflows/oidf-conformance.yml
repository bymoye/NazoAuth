name: oidf-conformance

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: "Exact deployed repository commit to test."
        required: true
        type: string
      target_issuer:
        description: "Public HTTPS issuer under test. No repository default is provided."
        required: true
        type: string
      plan_expression:
        description: "One official run-test-plan.py plan expression and configuration filename."
        required: true
        type: string

permissions:
  contents: read

jobs:
  oidf-conformance:
    runs-on: ubuntu-latest
    environment: oidf-conformance
    timeout-minutes: 360
    env:
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      TRUSTED_TARGET_ISSUER: ${{ vars.OIDF_TARGET_ISSUER }}
      CONFORMANCE_SERVER: https://www.certification.openid.net
      OIDF_REF: ${{ vars.OIDF_CONFORMANCE_SUITE_REF || 'dee9a25160e789f0f80517674693ef7989ab9fa1' }}
      PLAN_EXPRESSION: ${{ inputs.plan_expression }}
      OIDF_TARGET_ISSUER: ${{ inputs.target_issuer }}
      VERBOSE: ${{ vars.OIDF_VERBOSE || 'true' }}
      DISABLE_SSL_VERIFY: ${{ vars.OIDF_DISABLE_SSL_VERIFY || 'false' }}
      NO_PARALLEL: ${{ vars.OIDF_NO_PARALLEL || 'true' }}
      RUN_TIMEOUT_SECONDS: ${{ vars.OIDF_RUN_TIMEOUT_SECONDS || '10800' }}
      MONITOR_INTERVAL_SECONDS: ${{ vars.OIDF_MONITOR_INTERVAL_SECONDS || '0' }}
      RERUN: ${{ vars.OIDF_RERUN || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify deployed revision is trusted
        run: |
          set -euo pipefail
          git cat-file -e "$DEPLOYED_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOYED_SHA" "origin/${{ github.event.repository.default_branch }}"
          git checkout --detach "$DEPLOYED_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"

      - name: Verify target issuer is trusted
        run: |
          set -euo pipefail
          test -n "$TRUSTED_TARGET_ISSUER"
          test "$OIDF_TARGET_ISSUER" = "$TRUSTED_TARGET_ISSUER"
          test "$CONFORMANCE_SERVER" = "https://www.certification.openid.net"

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Clone official conformance suite
        run: |
          set -euo pipefail
          git init oidf-conformance-suite
          git -C oidf-conformance-suite remote add origin https://gitlab.com/openid/conformance-suite.git
          git -C oidf-conformance-suite fetch --depth 1 origin "$OIDF_REF"
          git -C oidf-conformance-suite checkout --detach FETCH_HEAD
          diff -u requirements/oidf-conformance.in oidf-conformance-suite/scripts/requirements.txt
          test -z "$(git -C oidf-conformance-suite status --porcelain --untracked-files=no)"

      - name: Install official runner dependencies
        run: python -m pip install --require-hashes -r requirements/oidf-conformance.txt

      - name: Install age decryptor
        run: cargo install rage --version 0.11.2 --locked

      - name: Materialize OIDF job secrets
        run: python scripts/materialize_github_oidf_secrets.py --minimal --output-dir "$RUNNER_TEMP/oidf-secrets"
        env:
          OIDF_PLAN_CONFIG_AGE_IDENTITY: ${{ secrets.OIDF_PLAN_CONFIG_AGE_IDENTITY }}
          OIDF_CIBA_AUTOMATED_DECISION_TOKEN: ${{ secrets.OIDF_CIBA_AUTOMATED_DECISION_TOKEN }}
          OIDF_CONFORMANCE_TOKEN: ${{ secrets.OIDF_CONFORMANCE_TOKEN }}

      - name: Write OIDF plan config
        run: |
          set -euo pipefail
          umask 077
          rage --decrypt \
            --identity "$RUNNER_TEMP/oidf-secrets/plan-config.agekey" \
            --output oidf-plan-config-secret-patch.json \
            docs/conformance/oidf-plan-config-secret-patch.json.age
          rage --decrypt \
            --identity "$RUNNER_TEMP/oidf-secrets/plan-config.agekey" \
            --output oidf-plan-config-ciba-secret-patch.json \
            docs/conformance/oidf-plan-config-ciba-secret-patch.json.age
          python - <<'PY'
          import json

          with open("oidf-plan-config-secret-patch.json", encoding="utf-8") as handle:
              base = json.load(handle)
          with open("oidf-plan-config-ciba-secret-patch.json", encoding="utf-8") as handle:
              ciba = json.load(handle)

          conflicts = sorted(key for key, value in ciba.items() if key in base and base[key] != value)
          if conflicts:
              raise SystemExit("conflicting OIDF secret patch keys: " + ", ".join(conflicts))

          base.update(ciba)
          with open("oidf-plan-config-secret-patch.merged.json", "w", encoding="utf-8") as handle:
              json.dump(base, handle, sort_keys=True)
              handle.write("\n")
          PY
          python scripts/materialize_oidf_plan_config.py \
            --template docs/conformance/oidf-plan-config-template.json \
            --secret-patch-file oidf-plan-config-secret-patch.merged.json \
            --ciba-automated-decision-token-file "$RUNNER_TEMP/oidf-secrets/ciba-decision-token" \
            --output oidf-plan-configs.json

      - name: Run OIDF conformance plan
        run: |
          set -euo pipefail
          args=(
            --suite-dir oidf-conformance-suite
            --conformance-server "$CONFORMANCE_SERVER"
            --plan-expression "$PLAN_EXPRESSION"
            --config-json-file oidf-plan-configs.json
            --target-issuer "$OIDF_TARGET_ISSUER"
            --timeout-seconds "$RUN_TIMEOUT_SECONDS"
            --monitor-interval-seconds "$MONITOR_INTERVAL_SECONDS"
            --token-file "$RUNNER_TEMP/oidf-secrets/suite-token"
          )
          if [ "$VERBOSE" = "true" ]; then
            args+=(--verbose)
          fi
          if [ "$DISABLE_SSL_VERIFY" = "true" ]; then
            args+=(--disable-ssl-verify)
          fi
          if [ "$NO_PARALLEL" = "true" ]; then
            args+=(--no-parallel)
          fi
          if [ -n "$RERUN" ]; then
            args+=(--rerun "$RERUN")
          fi
          python -u scripts/run_oidf_conformance.py "${args[@]}"
        env:
          OIDF_PLAN_SET_JSON: ${{ vars.OIDF_PLAN_SET_JSON }}

      - name: Verify official suite remained pristine
        if: always()
        run: |
          test ! -d oidf-conformance-suite/.git || {
            test "$(git -C oidf-conformance-suite rev-parse HEAD)" = "$OIDF_REF"
            test -z "$(git -C oidf-conformance-suite status --porcelain --untracked-files=no)"
          }

      - name: Remove OIDF job secrets
        if: always()
        run: |
          rm -f -- oidf-plan-config-secret-patch.json oidf-plan-config-ciba-secret-patch.json oidf-plan-config-secret-patch.merged.json oidf-plan-configs.json
          rm -rf -- "$RUNNER_TEMP/oidf-secrets"
